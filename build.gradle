plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven {
 	name = 'fabric'
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "GeyserMC Snapshots"
        url = "https://repo.opencollab.dev/maven-snapshots"
        mavenContent { snapshotsOnly() }
    }
    
    maven {
    	name = "Curse Maven"
    	url = "https://cursemaven.com"
	}
    maven { 
    	name "Cloth Config API"
    	url =  "https://maven.shedaniel.me/" 
    }
	
    mavenCentral()
 	flatDir {
        dirs 'libs' 
    }
    
     // Modrinth maven repo for Lucko's API
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        url "https://server.bbkr.space/artifactory/libs-release"
        content {
            includeGroup "io.github.cottonmc"
            includeGroup "blue.endless"
        }
    }
    
}

loom {
	splitEnvironmentSourceSets()

	mods {
		grave_danger_bedrock_port {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Floodgate API
	modImplementation "org.geysermc.floodgate:api:2.2.4-SNAPSHOT"
	modImplementation files('libs/floodgate-fabric-2.2.4-b38.jar')
	
	// Fabric Permissions API
	modImplementation "me.lucko:fabric-permissions-api:0.3.1"
	
	// Floodgate API Dependency Files
	modImplementation "org.incendo:cloud-fabric:2.0.0-beta.10"
    include "org.incendo:cloud-fabric:2.0.0-beta.10"
    modImplementation "jakarta.inject:jakarta.inject-api:2.0.1"
    implementation 'aopalliance:aopalliance:1.0'
    implementation 'org.java-websocket:Java-WebSocket:1.5.3'
    modImplementation "io.github.cottonmc:libgui:11.1.0+1.21"
    modImplementation "io.github.cottonmc:Jankson-Fabric:8.0.0+j1.2.3"
	implementation("io.github.juuxel:libninepatch:1.2.0")
	
	// Geyser Fabric
	compileOnly files('libs/geyser-fabric-Geyser-Fabric-2.4.4-b705.jar')
    modLocalRuntime files('libs/geyser-fabric-Geyser-Fabric-2.4.4-b705.jar')
    
	// Javax (what the sigma even is this)
	modImplementation "javax.inject:javax.inject:1"
	
	// Cloth Config API
	modApi "me.shedaniel.cloth:cloth-config-fabric:15.0.140"
	
	// You're in Grave Danger
	modImplementation files('libs/youre-in-grave-danger-fabric-2.4.17.jar')
	
	// Cumulus
	implementation files('libs/cumulus-1.1.2.jar')
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
